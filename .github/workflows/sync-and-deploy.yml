name: Sync Topics and deploy website
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read public repository Topics and rebuild archive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/sync_repos.py --target site --username LonzilFox
      - name: Commit README and data changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md data/projects.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: sync categorized public repositories'
            git push
          fi
      - name: Stage published static files
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -r assets data _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
